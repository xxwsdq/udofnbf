<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loot RPG v5.3.1</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
color:white;
transition:0.4s;
background:#1e3c2f;
}

.panel{
margin:10px;
padding:10px;
background:rgba(0,0,0,0.4);
border-radius:12px;
}

.center{text-align:center;}

button{
margin:5px;
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.section{display:none;}
.show{display:block;}

.item{
margin:5px 0;
padding:6px;
background:rgba(255,255,255,0.12);
border-radius:8px;
}

.chest{
font-size:70px;
transition:0.2s;
display:inline-block;
}

.popup{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.85);
padding:15px;
border-radius:10px;
animation:fade 1s forwards;
}

@keyframes fade{
0%{opacity:0;transform:translate(-50%,-60%) scale(0.5);}
100%{opacity:0;transform:translate(-50%,-40%) scale(1);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="panel center">
<h2>🎮 Введите ник</h2>
<input id="nick" placeholder="ник">
<button onclick="start()">Играть</button>
</div>

<!-- GAME -->
<div id="game" style="display:none;">

<div class="panel center">
<h2>🎮 LOOT RPG v5.3.1</h2>

<div>👤 <span id="name"></span></div>
<div>💰 <span id="coins">0</span></div>
<div>👆 <span id="clicks">0</span></div>
<div>🌍 <span id="worldName"></span></div>
<div>👹 <span id="bossInfo"></span></div>
<div>🔑 <span id="keys">0</span></div>

<button onclick="clicker()">👊</button>
</div>

<div class="panel center">
<button onclick="tab('quests')">🎯</button>
<button onclick="tab('chests')">🧰</button>
<button onclick="tab('worlds')">🌍</button>
<button onclick="tab('shop')">🎨</button>
<button onclick="tab('lb')">🏆</button>
</div>

<!-- QUESTS -->
<div class="panel section show" id="quests">
<h3>🎯 Квесты</h3>
<div id="questList"></div>
</div>

<!-- CHESTS -->
<div class="panel section" id="chests">
<h3>🧰 Сундуки</h3>
<div class="chest">🧰</div><br>
<button onclick="openChest()">Открыть</button>
</div>

<!-- WORLDS -->
<div class="panel section" id="worlds">
<h3>🌍 Миры</h3>
<div id="worldList"></div>
</div>

<!-- SHOP -->
<div class="panel section" id="shop">
<h3>🎨 Скины</h3>
<button onclick="buySkin('fire')">🔥 Fire</button>
<button onclick="buySkin('ice')">❄️ Ice</button>
</div>

<!-- LEADERBOARD -->
<div class="panel section" id="lb">
<h3>🏆 Лидерборд</h3>
<button onclick="saveScore()">💾 Save</button>
<button onclick="loadLB()">🔄 Load</button>
<div id="lbList"></div>
</div>

</div>

<script>

/* ================= FIREBASE ================= */

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= PLAYER ================= */

let player="";
let coins=0;
let clicks=0;
let keys=0;
let opened=0;

/* ================= WORLDS ================= */

let worlds=[
{name:"🌲 Лес",hp:80,boss:"Лесной",bg:"#1e4d2b",mult:1},
{name:"🏜 Пустыня",hp:160,boss:"Песчаный",bg:"#6b4f1d",mult:1.4},
{name:"❄️ Лёд",hp:320,boss:"Ледяной",bg:"#2b5f7a",mult:1.8},
{name:"🌋 Вулкан",hp:600,boss:"Вулкан",bg:"#5a1a1a",mult:2.5},
{name:"🚀 Космос",hp:1200,boss:"Космос",bg:"#0b0b2b",mult:3.5}
];

let worldIndex=0;
let bossHP=0;
let bossActive=false;

/* ================= QUESTS ================= */

let quests=[
{t:"200 кликов",need:200,type:"clicks",reward:50,done:false},
{t:"300 монет",need:300,type:"coins",reward:80,done:false},
{t:"2 сундука",need:2,type:"chest",reward:120,done:false}
];

/* ================= START ================= */

function start(){

let n=document.getElementById("nick").value.trim();

if(n.length<2){
alert("ник минимум 2 символа");
return;
}

player=n;

localStorage.setItem("player",player);

document.getElementById("login").style.display="none";
document.getElementById("game").style.display="block";

load();
initWorld();
updateUI();
renderQuests();
}

/* ================= CLICK + BALANCE ================= */

function clicker(){

let base=1;
let scale=1 + clicks/250;
let mult=worlds[worldIndex].mult;

coins += Math.floor(base*scale*mult);

clicks++;

/* 🔑 редкие ключи */
let keyChance=0.01 + worldIndex*0.003;
if(Math.random()<keyChance) keys++;

/* 👹 босс */
spawnBoss();

updateUI();
renderQuests();
save();
}

/* ================= BOSSES ================= */

function spawnBoss(){

if(bossActive) return;

bossActive=true;
bossHP=worlds[worldIndex].hp;

bossInfo.innerText=worlds[worldIndex].boss+" HP "+bossHP;
}

/* ================= CHEST (RARITY SYSTEM) ================= */

function openChest(){

if(keys<=0) return;

keys--;

let r=Math.random();
let reward;

if(r<0.6){
reward=20;
}else if(r<0.9){
reward=60;
}else if(r<0.98){
reward=150;
}else{
reward=300;
}

reward*=worlds[worldIndex].mult;

coins+=Math.floor(reward);

opened++;

popup(reward);

updateUI();
save();
}

/* ================= QUESTS ================= */

function renderQuests(){

questList.innerHTML=quests.map(q=>{

let p=0;

if(q.type==="clicks") p=clicks;
if(q.type==="coins") p=coins;
if(q.type==="chest") p=opened;

if(p>=q.need && !q.done){
q.done=true;
coins+=q.reward;
}

return `<div class="item">${q.done?"✅":"🎯"} ${q.t} ${p}/${q.need}</div>`;

}).join("");
}

/* ================= WORLD ================= */

function initWorld(){

document.body.style.background=worlds[worldIndex].bg;

worldName.innerText=worlds[worldIndex].name;
bossInfo.innerText=worlds[worldIndex].boss;
}

/* ================= SAVE ================= */

function save(){
localStorage.setItem("coins",coins);
localStorage.setItem("clicks",clicks);
localStorage.setItem("keys",keys);
localStorage.setItem("opened",opened);
localStorage.setItem("worldIndex",worldIndex);
}

/* ================= LOAD ================= */

function load(){

coins=+localStorage.getItem("coins")||0;
clicks=+localStorage.getItem("clicks")||0;
keys=+localStorage.getItem("keys")||0;
opened=+localStorage.getItem("opened")||0;
worldIndex=+localStorage.getItem("worldIndex")||0;

player=localStorage.getItem("player")||player;
}

/* ================= UI ================= */

function updateUI(){
coinsDisplay.innerText=coins;
clicksDisplay.innerText=clicks;
keysDisplay.innerText=keys;
name.innerText=player;
}

/* ================= LEADERBOARD ================= */

function saveScore(){

db.collection("leaderboard").doc(player).set({
name:player,
coins:coins,
clicks:clicks,
world:worldIndex,
time:Date.now()
});
}

function loadLB(){

db.collection("leaderboard")
.orderBy("coins","desc")
.limit(10)
.get()
.then(snap=>{

let html="";

snap.forEach(d=>{
let x=d.data();

html+=`
<div class="item">
🏆 ${x.name}<br>
💰 ${x.coins}
</div>`;
});

lbList.innerHTML=html;

});
}

/* ================= TABS ================= */

function tab(id){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("show"));

document.getElementById(id).classList.add("show");
}

/* ================= POPUP ================= */

function popup(a){

let d=document.createElement("div");
d.className="popup";
d.innerText="🎁 +"+a;

document.body.appendChild(d);

setTimeout(()=>d.remove(),1000);
}

</script>

</body>
  </html>
