<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loot RPG FULL v3.1</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
color:white;
transition:0.5s;
}

.panel{
margin:10px;
padding:10px;
background:rgba(0,0,0,0.35);
border-radius:12px;
}

.center{text-align:center;}

#btn{
width:160px;
height:160px;
border:none;
border-radius:50%;
font-size:55px;
cursor:pointer;
}

.menu button,
button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.section{display:none;}
.show{display:block;}

.item{
margin:6px 0;
padding:8px;
background:rgba(255,255,255,0.12);
border-radius:8px;
}

.locked{opacity:0.4;}

/* 🧰 3D CHEST */
.chestWrap{
perspective:800px;
margin:20px auto;
width:120px;
height:120px;
display:flex;
justify-content:center;
align-items:center;
}

.chest3d{
font-size:80px;
transform-style:preserve-3d;
transition:0.6s;
cursor:pointer;
}

.chestIdle{
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%{transform:rotateY(0deg) translateY(0px);}
50%{transform:rotateY(20deg) translateY(-5px);}
100%{transform:rotateY(0deg) translateY(0px);}
}

.chestOpen{
animation:openChest3D 0.8s forwards;
}

@keyframes openChest3D{
0%{transform:rotateX(0deg) scale(1);}
40%{transform:rotateX(-20deg) scale(1.1);}
70%{transform:rotateX(-60deg) scale(1.2);}
100%{transform:rotateX(-90deg) scale(1.1);}
}

.chestGlow{
text-shadow:0 0 20px gold;
}

/* 💥 reward */
.rewardPopup{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.85);
padding:15px;
border-radius:10px;
font-size:20px;
animation:pop 1s forwards;
}

@keyframes pop{
0%{opacity:0;transform:translate(-50%,-60%) scale(0.5);}
50%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
100%{opacity:0;transform:translate(-50%,-40%) scale(1);}
}
</style>
</head>

<body>

<div class="panel center">
<h2>🎮 LOOT RPG v3.1</h2>

<div>👤 <span id="nameDisplay"></span></div>

<button id="btn">👊</button>

<div>💰 <span id="coins">0</span></div>
<div>👆 <span id="clicks">0</span></div>
<div>🌍 <span id="locName"></span></div>
<div>👹 <span id="bossInfo"></span></div>
</div>

<div class="menu center">
<button onclick="tab('quests')">🎯</button>
<button onclick="tab('chests')">🧰</button>
<button onclick="tab('skins')">🎨</button>
<button onclick="tab('world')">🌍</button>
<button onclick="tab('lb')">🏆</button>
</div>

<!-- QUESTS -->
<div class="panel section show" id="quests">
<h3>🎯 Квесты</h3>
<div id="questList"></div>
</div>

<!-- CHESTS -->
<div class="panel section" id="chests">
<h3>🧰 Сундук</h3>

<div class="chestWrap">
  <div id="chest" class="chest3d">🧰</div>
</div>

<button onclick="openChestAnim('rare')">Open Chest</button>
</div>

<!-- SKINS -->
<div class="panel section" id="skins">
<h3>🎨 Скины</h3>
<button onclick="buySkin('default')">👊 Default</button>
<button onclick="buySkin('fire')">🔥 Fire</button>
<button onclick="buySkin('ice')">❄️ Ice</button>
<button onclick="buySkin('gold')">💛 Gold</button>
<button onclick="buySkin('rainbow')">🌈 Legendary</button>
<div id="skinInfo"></div>
</div>

<!-- WORLD -->
<div class="panel section" id="world">
<h3>🌍 Локации</h3>
<div id="worldButtons"></div>
</div>

<!-- LB -->
<div class="panel section" id="lb">
<h3>🏆 Лидерборд</h3>
<button onclick="saveScore()">💾 Save</button>
<button onclick="loadLeaderboard()">🔄 Load</button>
<div id="lbList"></div>
</div>

<script>

/* FIREBASE */
const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"click-74bb1.firebaseapp.com",
projectId:"click-74bb1",
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* PLAYER */
let playerName=prompt("Ник:")||"Player";
nameDisplay.innerText=playerName;

/* DATA */
let coins=0, clicks=0, openedChests=0;

/* SKINS */
let skin="default";
const skins={default:"👊",fire:"🔥",ice:"❄️",gold:"💛",rainbow:"🌈"};
const prices={fire:500,ice:1500,gold:5000,rainbow:25000,default:0};
const rarity={default:"Common",fire:"Rare",ice:"Epic",gold:"Mythic",rainbow:"Legendary"};

/* WORLD */
let order=["forest","desert","ice","volcano","space"];
let unlocked=0;
let current="forest";

const loc={
forest:{name:"🌲 Лес",bg:"linear-gradient(#2e8b57,#145a32)",mult:1},
desert:{name:"🏜 Пустыня",bg:"linear-gradient(#f7c873,#d98b2b)",mult:1.5},
ice:{name:"❄️ Лёд",bg:"linear-gradient(#cfefff,#5dade2)",mult:2},
volcano:{name:"🌋 Вулкан",bg:"linear-gradient(#ff512f,#240b36)",mult:3},
space:{name:"🚀 Космос",bg:"linear-gradient(#000,#3a0ca3)",mult:5}
};

/* BOSS */
let defeated={forest:false,desert:false,ice:false,volcano:false,space:false};
let boss={active:false,hp:0,rew:0,name:""};

const bosses={
forest:{hp:1000,rew:500,name:"Лесной"},
desert:{hp:2000,rew:1000,name:"Пустынный"},
ice:{hp:4000,rew:2000,name:"Ледяной"},
volcano:{hp:7000,rew:4000,name:"Вулкан"},
space:{hp:10000,rew:10000,name:"Космос"}
};

/* CLICK */
btn.onclick=()=>{

coins++; clicks++;

updateUI();
updateQuests();

if(boss.active){
boss.hp--;
if(boss.hp<=0) winBoss();
}else{
if(clicks%50===0) spawnBoss();
}

};

/* CHEST ANIMATION */
function openChestAnim(){

let chest=document.getElementById("chest");

chest.classList.add("chestOpen","chestGlow");

setTimeout(()=>{
chest.classList.remove("chestOpen","chestGlow");
},800);

let reward=Math.floor((10+Math.random()*100)*loc[current].mult);
coins+=reward;

showReward(reward);
updateUI();

}

/* REWARD */
function showReward(a){
let d=document.createElement("div");
d.className="rewardPopup";
d.innerText="🎁 +"+a;
document.body.appendChild(d);
setTimeout(()=>d.remove(),1000);
}

/* BOSS */
function spawnBoss(){
if(defeated[current])return;

let b=bosses[current];

boss={active:true,hp:b.hp,rew:b.rew,name:b.name};

alert("👹 "+b.name);
}

function winBoss(){
boss.active=false;
coins+=boss.rew;
defeated[current]=true;

if(unlocked<order.length-1)unlocked++;

renderWorld();
}

/* UI */
function updateUI(){
coinsDisplay.innerText=coins;
clicksDisplay.innerText=clicks;
locName.innerText=loc[current].name;

document.body.style.background=loc[current].bg;
}

/* INIT */
updateUI();
</script>

</body>
</html>
