<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ NEXUS — ритм-игра (телефон/ПК) ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0f1e 0%, #03050a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Orbitron', monospace;
            overflow: hidden;
            padding: 12px;
        }

        .game-wrapper {
            position: relative;
            border-radius: 32px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(0,255,255,0.2);
            width: min(95vw, 95vh);
            max-width: 800px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            cursor: pointer;
            width: 100%;
            height: auto;
            background-color: #03050c;
        }

        .hud {
            position: absolute;
            top: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 8px cyan;
        }

        .score-card, .miss-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
            color: #0ff;
            box-shadow: 0 0 12px rgba(0,255,255,0.6);
            border: 1px solid cyan;
        }

        .miss-card {
            color: #ff66cc;
            border-color: #ff66cc;
            box-shadow: 0 0 10px #ff66cc;
        }

        .restart-btn {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 2px solid cyan;
            color: cyan;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 48px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            font-family: monospace;
            z-index: 20;
            pointer-events: auto;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .restart-btn:active {
            transform: translateX(-50%) scale(0.96);
            background: cyan;
            color: black;
        }

        @media (max-width: 600px) {
            .score-card, .miss-card {
                padding: 5px 14px;
                font-size: 1rem;
            }
            .restart-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
                bottom: 12px;
            }
            .hud {
                top: 8px;
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="hud">
        <div class="score-card">✨ <span id="scoreValue">0</span></div>
        <div class="miss-card">💔 <span id="missValue">0</span> / 3</div>
    </div>
    <button class="restart-btn" id="restartButton">⟳ NEXUS</button>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // адаптация под экран (сохраняем пропорции 800x600)
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxW = Math.min(window.innerWidth - 32, 800);
            const maxH = Math.min(window.innerHeight - 120, 600);
            const scale = Math.min(maxW / 800, maxH / 600);
            const displayW = 800 * scale;
            const displayH = 600 * scale;
            canvas.style.width = `${displayW}px`;
            canvas.style.height = `${displayH}px`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- ИГРОВЫЕ ПАРАМЕТРЫ ----------
        let score = 0;
        let misses = 0;
        let gameActive = true;
        let combo = 0;
        let lastBeatFrame = 0;
        
        // Ритмические круги (targets)
        let targets = [];
        let frame = 0;
        let beatInterval = 80;      // через сколько кадров появляется новый круг (чем меньше, тем быстрее)
        let nextBeatCounter = 10;    // начальный отсчёт до бита
        
        // Эффекты частиц
        let particles = [];
        
        // Звуковой контекст (генерируем синт-бип)
        let audioCtx = null;
        let soundEnabled = false;
        
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            soundEnabled = true;
        }
        
        function playPerfectSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.25;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.3);
        }
        
        function playMissSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 320;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        }
        
        // частицы после удара
        function addBurst(x, y, color) {
            for(let i=0; i<18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push({
                    x: x, y: y, vx: vx, vy: vy, life: 1.0,
                    color: color || `hsl(${Math.random() * 60 + 180}, 100%, 60%)`,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        // создать цель (пульсирующий круг)
        function addTarget() {
            if (!gameActive) return;
            const radius = 30 + Math.sin(Date.now() * 0.008) * 4;
            targets.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                radius: 28,
                life: 1.0,     // 1 -> уменьшается, при 0 пропускаем (мисс)
                createdAt: frame,
                maxLife: 70     // через 70 кадров цель исчезнет, если не кликнуть
            });
        }
        
        // обновить миссы и цели
        function updateGame() {
            if (!gameActive) return;
            
            // Генерация целей в ритме
            nextBeatCounter--;
            if (nextBeatCounter <= 0) {
                addTarget();
                nextBeatCounter = beatInterval;
                // ритм становится чуть плотнее с ростом счёта
                beatInterval = Math.max(40, 80 - Math.floor(score / 20));
            }
            
            // обновление существующих целей (уменьшаем жизнь)
            for(let i=0; i<targets.length; i++) {
                targets[i].life -= 1 / targets[i].maxLife;
                if(targets[i].life <= 0) {
                    // ПРОПУСК -> МИСС
                    targets.splice(i,1);
                    i--;
                    misses++;
                    document.getElementById('missValue').innerText = misses;
                    playMissSound();
                    addBurst(canvas.width/2 + (Math.random()-0.5)*200, canvas.height/2 + (Math.random()-0.5)*150, "#ff3366");
                    combo = 0;
                    if(misses >= 3) {
                        gameActive = false;
                    }
                }
            }
        }
        
        // обработка клика/касания — точка попадания
        function handleTap(e) {
            if (!gameActive) return;
            e.preventDefault();
            
            // Включаем звук по первому касанию (требование браузера)
            if (!audioCtx) {
                initAudio();
                audioCtx.resume();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // координаты касания относительно canvas
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            
            let hit = false;
            for(let i=0; i<targets.length; i++) {
                const t = targets[i];
                const dx = canvasX - t.x;
                const dy = canvasY - t.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < t.radius) {
                    // ПОПАДАНИЕ!
                    hit = true;
                    targets.splice(i,1);
                    score++;
                    combo++;
                    document.getElementById('scoreValue').innerText = score;
                    playPerfectSound();
                    addBurst(t.x, t.y, "#88ffcc");
                    // маленький бонус: частицы радости
                    for(let s=0;s<8;s++) {
                        particles.push({
                            x: t.x, y: t.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4-2,
                            life: 0.9, color: `hsl(${Math.random()*80 + 160}, 100%, 65%)`, size: 3
                        });
                    }
                    break;
                }
            }
            if(!hit && gameActive) {
                // промах мимо круга – лёгкий штраф (не мисс, но сбрасываем комбо)
                combo = 0;
                addBurst(canvasX, canvasY, "#ffaa44");
            }
        }
        
        // обновить физику частиц
        function updateParticles() {
            for(let i=0; i<particles.length; i++) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].vy += 0.15;
                particles[i].life -= 0.02;
                if(particles[i].life <= 0 || particles[i].y > canvas.height+50 || particles[i].x < -50 || particles[i].x > canvas.width+100) {
                    particles.splice(i,1);
                    i--;
                }
            }
        }
        
        // ---------- ОТРИСОВКА (вау-эффекты) ----------
        function draw() {
            if(!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // мерцающий фон
            const grad = ctx.createLinearGradient(0,0, canvas.width, canvas.height);
            grad.addColorStop(0, `hsl(220, 80%, ${5+Math.sin(frame*0.02)*2}%)`);
            grad.addColorStop(1, `hsl(260, 70%, ${4+Math.cos(frame*0.03)*1.5}%)`);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0, canvas.width, canvas.height);
            
            // звёздное поле (движущиеся)
            for(let i=0;i<150;i++) {
                let x = (i*131)%canvas.width;
                let y = (i*253 + frame)%canvas.height;
                ctx.fillStyle = `rgba(255,240,200,${0.3+Math.sin(frame*0.02+i)*0.2})`;
                ctx.beginPath();
                ctx.arc(x,y,1.5,0,Math.PI*2);
                ctx.fill();
            }
            
            // цели: пульсирующие круги с неоном
            for(let t of targets) {
                const pulse = 0.8 + Math.sin(frame * 0.2) * 0.2;
                const rad = t.radius * (0.7 + t.life * 0.3);
                ctx.shadowBlur = 18;
                ctx.shadowColor = "#0ff";
                ctx.beginPath();
                ctx.arc(t.x, t.y, rad, 0, Math.PI*2);
                ctx.fillStyle = `rgba(0, 210, 255, ${0.5 + Math.sin(frame*0.15)*0.2})`;
                ctx.fill();
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(t.x, t.y, rad-5, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 255, 200, 0.9)`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(t.x, t.y, rad-10, 0, Math.PI*2);
                ctx.fillStyle = `#ffffff`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // частицы
            for(let p of particles) {
                ctx.globalAlpha = p.life * 0.9;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.rect(p.x-2, p.y-2, p.size, p.size);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // центральный указатель (плавный)
            ctx.shadowBlur = 14;
            ctx.font = "bold 24px 'Orbitron', monospace";
            ctx.fillStyle = `rgba(0, 255, 200, ${0.7+Math.sin(frame*0.1)*0.3})`;
            ctx.shadowColor = "#0ff";
            ctx.fillText("⚡ TAP", canvas.width/2-50, canvas.height-40);
            
            if (!gameActive) {
                ctx.font = "bold 38 monospace";
                ctx.fillStyle = "#ff44aa";
                ctx.shadowBlur = 16;
                ctx.fillText("💀 GAME OVER", canvas.width/2-140, canvas.height/2);
                ctx.font = "18px monospace";
                ctx.fillStyle = "cyan";
                ctx.fillText("нажмите NEXUS", canvas.width/2-80, canvas.height/2+60);
            }
            ctx.shadowBlur = 0;
        }
        
        function gameLoop() {
            if(gameActive) {
                updateGame();
                updateParticles();
            } else {
                updateParticles();
            }
            draw();
            frame++;
            requestAnimationFrame(gameLoop);
        }
        
        // рестарт
        function restartGame() {
            score = 0;
            misses = 0;
            gameActive = true;
            targets = [];
            particles = [];
            combo = 0;
            frame = 0;
            beatInterval = 78;
            nextBeatCounter = 6;
            document.getElementById('scoreValue').innerText = "0";
            document.getElementById('missValue').innerText = "0";
            if(audioCtx && audioCtx.state !== 'running') {
                audioCtx.resume();
            }
        }
        
        // события для телефона + мыши
        canvas.addEventListener('touchstart', handleTap, {passive: false});
        canvas.addEventListener('mousedown', handleTap);
        
        const restartBtn = document.getElementById('restartButton');
        restartBtn.addEventListener('click', () => {
            restartGame();
        });
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restartGame();
        });
        
        // начальный старт
        restartGame();
        gameLoop();
        
        // разблокировка звука при касании canvas
        canvas.addEventListener('touchstart', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, {once: true});
    })();
</script>
</body>
  </html>
