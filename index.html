<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loot RPG v4 Clean</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
transition:0.4s;
background:linear-gradient(#2e8b57,#145a32);
}

.panel{
margin:10px;
padding:10px;
background:rgba(0,0,0,0.35);
border-radius:12px;
}

.center{text-align:center;}

#btn{
width:160px;
height:160px;
border:none;
border-radius:50%;
font-size:50px;
cursor:pointer;
}

.menu button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.section{display:none;}
.show{display:block;}

.item{
margin:6px 0;
padding:8px;
background:rgba(255,255,255,0.12);
border-radius:8px;
}

/* 🧰 chest */
.chest{
font-size:70px;
display:inline-block;
transition:0.3s;
}

.chest.open{
transform:scale(1.3) rotateX(40deg);
text-shadow:0 0 20px gold;
}

/* 🎁 popup */
.popup{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.85);
padding:15px;
border-radius:10px;
animation:fade 1s forwards;
}

@keyframes fade{
0%{opacity:0;transform:translate(-50%,-60%) scale(0.5);}
50%{opacity:1;}
100%{opacity:0;transform:translate(-50%,-40%) scale(1);}
}

</style>
</head>

<body>

<div class="panel center">
<h2>🎮 LOOT RPG v4 CLEAN</h2>

<div>👤 <span id="name"></span></div>

<button id="btn">👊</button>

<div>💰 <span id="coins">0</span></div>
<div>👆 <span id="clicks">0</span></div>
</div>

<!-- MENU -->
<div class="menu center">
<button onclick="tab('quests')">🎯</button>
<button onclick="tab('chests')">🧰</button>
<button onclick="tab('shop')">🎨</button>
</div>

<!-- QUESTS -->
<div class="panel section show" id="quests">
<h3>🎯 Квесты</h3>
<div id="questList"></div>
</div>

<!-- CHESTS -->
<div class="panel section" id="chests">
<h3>🧰 Сундук</h3>
<div class="chest" id="chest">🧰</div><br>
<button onclick="openChest()">Открыть</button>
</div>

<!-- SHOP -->
<div class="panel section" id="shop">
<h3>🎨 Магазин (скины)</h3>
<button onclick="buySkin('default')">👊 Default</button>
<button onclick="buySkin('fire')">🔥 Fire (500)</button>
<button onclick="buySkin('ice')">❄️ Ice (1500)</button>
</div>

<script>

/* DATA */
let coins=0;
let clicks=0;
let opened=0;

let player=prompt("Ник:")||"Player";
name.innerText=player;

/* SKINS */
let skin="default";
const skins={
default:"👊",
fire:"🔥",
ice:"❄️"
};

const prices={
fire:500,
ice:1500
};

/* QUESTS */
let quests=[
{t:"100 кликов",need:100,type:"clicks",reward:100,done:false},
{t:"500 монет",need:500,type:"coins",reward:200,done:false},
{t:"3 сундука",need:3,type:"chest",reward:300,done:false}
];

/* CLICK */
btn.onclick=()=>{

coins++;
clicks++;

updateUI();
updateQuests();

};

/* TAB SYSTEM */
function tab(id){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("show");
});

document.getElementById(id).classList.add("show");

}

/* CHEST */
function openChest(){

let c=document.getElementById("chest");

c.classList.add("open");

setTimeout(()=>c.classList.remove("open"),400);

let reward=Math.floor(Math.random()*100)+10;

coins+=reward;
opened++;

showPopup(reward);

updateUI();
updateQuests();

}

/* POPUP */
function showPopup(a){

let d=document.createElement("div");
d.className="popup";
d.innerText="🎁 +"+a;
document.body.appendChild(d);

setTimeout(()=>d.remove(),1000);

}

/* QUESTS */
function updateQuests(){

questList.innerHTML=quests.map(q=>{

let prog=0;

if(q.type==="clicks") prog=clicks;
if(q.type==="coins") prog=coins;
if(q.type==="chest") prog=opened;

if(prog>=q.need && !q.done){
q.done=true;
coins+=q.reward;
}

return `
<div class="item">
${q.done?"✅":"🎯"} ${q.t}<br>
${prog}/${q.need}
</div>
`;

}).join("");

}

/* SHOP */
function buySkin(s){

if(coins<prices[s])return alert("мало монет");

coins-=prices[s];
skin=s;

btn.innerText=skins[s];

updateUI();

}

/* UI */
function updateUI(){

coinsDisplay.innerText=coins;
clicksDisplay.innerText=clicks;

}

/* INIT */
updateQuests();

</script>

</body>
</html>
