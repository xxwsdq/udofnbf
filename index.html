<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Final Loot Game FIXED</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
  overflow:hidden;
}

#btn{
  width:110px;
  height:110px;
  border-radius:50%;
  border:none;
  font-size:30px;
  cursor:pointer;
  margin-top:20px;
}

.shop{
  margin:5px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#chestOverlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#chestImg{
  width:120px;
  height:120px;
}

.shake{ animation:shake 0.4s infinite; }

@keyframes shake{
  0%{transform:translate(0,0);}
  25%{transform:translate(5px,-5px);}
  50%{transform:translate(-5px,5px);}
  75%{transform:translate(5px,5px);}
  100%{transform:translate(0,0);}
}

#result{
  margin-top:15px;
  color:yellow;
  font-size:20px;
}

#boss{
  position:absolute;
  top:10px;
  right:10px;
  color:red;
}
</style>
</head>

<body>

<h2>🎮 Final Loot Game FIXED</h2>

<div>💰 Монеты: <span id="coins">0</span></div>
<div>⭐ Уровень: <span id="level">1</span></div>
<div id="boss"></div>

<div>
<button class="shop" onclick="buySkin('watermelon',30)">🍉 Арбуз</button>
<button class="shop" onclick="buySkin('invincible',40)">🦸 Герой</button>
</div>

<button id="btn" onclick="clicker()">🎮</button>

<div>
<button onclick="openChest('rare')">🧰 Rare</button>
<button onclick="openChest('epic')">🧰 Epic</button>
<button onclick="openChest('mythic')">🧰 Mythic</button>
<button onclick="openChest('legendary')">🧰 Legendary</button>
</div>

<div id="chestOverlay">
  <img id="chestImg" src="https://cdn-icons-png.flaticon.com/512/107/107831.png">
  <div id="result"></div>
</div>

<audio id="sound" src="https://cdn.pixabay.com/audio/2022/03/10/audio_5d4b1c2d7e.mp3"></audio>

<script>

let coins = 0;
let clicks = 0;
let skin = "green";

let btn = document.getElementById("btn");

let owned = JSON.parse(localStorage.getItem("owned") || "null") || {
 watermelon:true,
 invincible:false
};

let keys = JSON.parse(localStorage.getItem("keys") || "null") || {
 rare:0,
 epic:0,
 mythic:0,
 legendary:0
};

let bossHP = 0;
let bossActive = false;

/* SAVE */
function save(){
 localStorage.setItem("coins",coins);
 localStorage.setItem("clicks",clicks);
 localStorage.setItem("skin",skin);
 localStorage.setItem("owned",JSON.stringify(owned));
 localStorage.setItem("keys",JSON.stringify(keys));
}

/* LOAD */
function load(){
 coins = Number(localStorage.getItem("coins") || 0);
 clicks = Number(localStorage.getItem("clicks") || 0);
 skin = localStorage.getItem("skin") || "green";
 update();
}

/* LEVEL */
function level(){
 if(clicks < 5) return 1;
 if(clicks < 10) return 2;
 if(clicks < 20) return 3;
 return 4;
}

/* CLICK */
function clicker(){

 coins++;
 clicks++;

 if(Math.random()<0.2) keys.rare++;
 if(Math.random()<0.12) keys.epic++;
 if(Math.random()<0.07) keys.mythic++;
 if(Math.random()<0.03) keys.legendary++;

 update();
 save();

 if(clicks % 15 === 0) startBoss();

}

/* SKIN */
function buySkin(type,price){

 if(!owned[type]){
  if(coins < price) return;
  coins -= price;
  owned[type] = true;
 }

 skin = type;
 applySkin();
 save();
 update();
}

/* APPLY SKIN FIXED */
function applySkin(){

 if(!btn) return;

 if(skin === "watermelon")
  btn.innerHTML = "🍉";

 else if(skin === "invincible")
  btn.innerHTML = "🦸";

 else
  btn.innerHTML = "🎮";
}

/* CHEST */
function openChest(type){

 if(keys[type] <= 0){
  alert("нет ключа");
  return;
 }

 keys[type]--;

 let overlay = document.getElementById("chestOverlay");
 let box = document.getElementById("chestImg");
 let res = document.getElementById("result");

 overlay.style.display = "flex";
 box.classList.add("shake");
 res.innerText = "";

 setTimeout(()=>{

  box.classList.remove("shake");

  let r = Math.random();
  let reward = "";

  if(type==="rare"){
   if(r<0.3) reward="+1💰";
   else if(r<0.6) reward="+2💰";
   else if(r<0.8) reward="+5💰";
   else reward="ничего";
  }

  if(type==="epic"){
   if(r<0.4) reward="+10💰";
   else reward="ключ";
  }

  if(type==="mythic"){
   reward="+20💰";
  }

  if(type==="legendary"){
   reward="+30💰";
  }

  coins += Math.floor(Math.random()*5);

  res.innerText = reward;

  document.getElementById("sound").play();

  setTimeout(()=>{
   overlay.style.display = "none";
   update();
   save();
  },1000);

 },1000);
}

/* BOSS FIXED */
function startBoss(){

 bossActive = true;
 bossHP = 10;

 document.getElementById("boss").innerText = "👹 HP: " + bossHP;

 let interval = setInterval(()=>{

  bossHP--;

  document.getElementById("boss").innerText = "👹 HP: " + bossHP;

  if(bossHP <= 0){
   clearInterval(interval);
   bossActive = false;
   coins += 50;
   document.getElementById("boss").innerText = "💀 defeated!";
   save();
   update();
  }

 }, 1000);
}

/* UPDATE */
function update(){
 document.getElementById("coins").innerText = coins;
 document.getElementById("level").innerText = level();
}

load();
applySkin();
update();

</script>

</body>
</html>
