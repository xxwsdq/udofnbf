<!DOCTYPE html>
<html>
<head>
  <title>Мини игра</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
      font-size: 18px;
    }

    #coins {
      margin-top: 10px;
      font-size: 18px;
    }

    /* 🎮 кнопка */
    #btn {
      position: absolute;
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 50%;
      cursor: pointer;

      font-weight: bold;
      color: black;

      background: linear-gradient(45deg, #00ff99, #00ccff);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);

      transition: transform 0.1s, box-shadow 0.2s;
    }

    #btn:active {
      transform: scale(0.9);
    }

    button.shop {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 🎉 эффект покупки */
    #buyEffect {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      font-weight: bold;
      color: yellow;
      opacity: 0;
      pointer-events: none;
    }

    /* 💥 конфетти */
    #confetti {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<h1>🎮 Игра</h1>

<div id="coins">Монеты: 0</div>

<div>
  <button class="shop" onclick="buySkin('green', 0)">Зелёный (0)</button>
  <button class="shop" onclick="buySkin('red', 10)">Красный (10)</button>
  <button class="shop" onclick="buySkin('blue', 20)">Синий (20)</button>
</div>

<button id="btn" onclick="win()">+</button>

<div id="buyEffect">КУПЛЕНО 🎉</div>
<canvas id="confetti"></canvas>

<!-- 🎵 музыка -->
<audio id="bgmusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b7c2f.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("btn");
const coinsText = document.getElementById("coins");
const buyEffect = document.getElementById("buyEffect");
const music = document.getElementById("bgmusic");

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let coins = Number(localStorage.getItem("coins")) || 0;
let skin = localStorage.getItem("skin") || "green";

let owned = JSON.parse(localStorage.getItem("owned")) || {
  green: true,
  red: false,
  blue: false
};

function save() {
  localStorage.setItem("coins", coins);
  localStorage.setItem("skin", skin);
  localStorage.setItem("owned", JSON.stringify(owned));
}

function update() {
  coinsText.innerText = "Монеты: " + coins;
  save();
}

function applySkin() {
  if (skin === "green") btn.style.background = "#00ff99";
  if (skin === "red") btn.style.background = "red";
  if (skin === "blue") btn.style.background = "blue";
}

function moveButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

function win() {
  coins += 1;
  update();
  moveButton();
  startMusic();
}

function buySkin(type, price) {
  if (!owned[type]) {
    if (coins < price) {
      alert("Не хватает монет 😢");
      return;
    }
    coins -= price;
    owned[type] = true;
  }

  skin = type;
  applySkin();
  update();

  showEffect();
  createConfetti();
}

/* 🎉 эффект */
function showEffect() {
  buyEffect.style.opacity = "1";
  buyEffect.style.transform = "translateX(-50%) scale(1.3)";

  setTimeout(() => {
    buyEffect.style.opacity = "0";
    buyEffect.style.transform = "translateX(-50%) scale(1)";
  }, 600);
}

/* 🎵 музыка */
function startMusic() {
  music.volume = 0.3;
  music.play().catch(() => {});
}

/* 💥 конфетти */
let particles = [];

function createConfetti() {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 3,
      dx: (Math.random() - 0.5) * 8,
      dy: Math.random() * -8,
      size: Math.random() * 6 + 2,
      color: `hsl(${Math.random() * 360},100%,50%)`
    });
  }
  animate();
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i) => {
    p.x += p.dx;
    p.y += p.dy;
    p.dy += 0.2;

    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);

    if (p.y > canvas.height) particles.splice(i,1);
  });

  if (particles.length > 0) requestAnimationFrame(animate);
}

/* старт */
setInterval(moveButton, 700);
moveButton();
applySkin();
update();
</script>

</body>
</html>
