<!DOCTYPE html>
<html>
<head>
  <title>Мини-игра</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #111;
      color: white;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      top: 20px;
      font-size: 20px;
    }

    button {
      position: absolute;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #00ff99;
    }
  </style>
</head>

<body>

<h1>Поймай кнопку 😄</h1>
<button onclick="win()">Нажми меня</button>

<script>
  const btn = document.querySelector("button");

  function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
  }

  function win() {
    alert("Ты победил 🎉");
  }

  // кнопка убегает каждые 500 мс
  setInterval(moveButton, 500);

  // стартовая позиция
  moveButton();
</script>

</body>
</html>
