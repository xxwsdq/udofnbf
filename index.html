<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FINAL BOSS CLICKER</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#0a0a0a,#000);
  color:white;
  text-align:center;
}

/* HUD */
#hud{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#111;
  border-bottom:1px solid #333;
}

/* CLICK */
#btn{
  width:170px;
  height:170px;
  border-radius:50%;
  border:none;
  font-size:45px;
  margin-top:40px;
  background:linear-gradient(45deg,#ffd54f,#ff6f00);
  box-shadow:0 0 30px rgba(255,200,0,0.3);
  transition:0.1s;
}
#btn:active{transform:scale(0.92);}

/* FLOAT */
.float{
  position:absolute;
  animation:up 0.8s linear forwards;
  pointer-events:none;
}

@keyframes up{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-80px);opacity:0;}
}

/* MENU */
#menu{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.card{
  background:#222;
  padding:20px;
  border-radius:12px;
}

/* BOSS */
#boss{
  position:absolute;
  top:10px;
  right:10px;
  color:red;
  font-weight:bold;
}

/* EFFECT */
.hit{
  animation:hit 0.15s;
}

@keyframes hit{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<!-- HUD -->
<div id="hud">
  <div>💰 <span id="coins">0</span></div>
  <div>🌍 <span id="loc">village</span></div>
  <div>⭐ Lv <span id="lvl">1</span></div>
</div>

<div id="boss"></div>

<button id="btn" onclick="clicker()">👊</button>

<div id="menu">
  <button onclick="openShop()">🛒</button>
  <button onclick="openChest()">🧰</button>
  <button onclick="nextLoc()">🌍</button>
</div>

<!-- SHOP -->
<div id="shop" class="modal">
  <div class="card">
    <h3>Perks</h3>
    <button onclick="perk('power')">💥 +DMG</button>
    <button onclick="perk('luck')">🍀 +DROP</button>
    <br><br>
    <button onclick="closeAll()">Close</button>
  </div>
</div>

<!-- CHEST -->
<div id="chest" class="modal">
  <div class="card">
    <h3>Chest</h3>
    <button onclick="openBox()">Open</button>
    <br><br>
    <button onclick="closeAll()">Close</button>
  </div>
</div>

<script>

/* ===== CORE DATA ===== */
let coins=0;
let clicks=0;
let loc="village";

let boss=null;
let phase=1;

let dmg=1;
let luck=1;

/* ===== SAVE ===== */
function save(){
 localStorage.setItem("fb",JSON.stringify({
  coins,clicks,loc,dmg,luck
 }));
}

/* ===== LOAD ===== */
function load(){
 let d=JSON.parse(localStorage.getItem("fb")||"null");
 if(!d) return;
 coins=d.coins;
 clicks=d.clicks;
 loc=d.loc;
 dmg=d.dmg;
 luck=d.luck;
}

/* ===== FLOAT TEXT ===== */
function float(txt,x,y,col){
 let e=document.createElement("div");
 e.className="float";
 e.innerText=txt;
 e.style.left=x+"px";
 e.style.top=y+"px";
 e.style.color=col||"white";
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),800);
}

/* ===== CLICK ===== */
function clicker(){

 coins+=1;
 clicks++;

 float("+1",200,200,"yellow");

 spawnBoss();

 if(boss){
  boss.hp -= dmg;

  document.getElementById("boss").classList.add("hit");

  setTimeout(()=>{
   document.getElementById("boss").classList.remove("hit");
  },150);

  float("-"+dmg,220,120,"red");

  checkBoss();
 }

 update();
 save();
}

/* ===== BOSS SYSTEM (PHASES) ===== */
function spawnBoss(){

 if(clicks%12!==0) return;

 const data={
  village:{name:"Goblin",hp:20},
  volcano:{name:"Golem",hp:50},
  space:{name:"Void King",hp:120}
 };

 boss={...data[loc]};
 phase=1;

 document.getElementById("boss").innerText=
 "👹 "+boss.name+" HP "+boss.hp;
}

/* ===== BOSS LOGIC ===== */
function checkBoss(){

 if(!boss) return;

 if(boss.hp<=0){
  coins+=50*phase;
  phase++;

  if(phase<=3){
   boss.hp=20*phase;
  }else{
   boss=null;
   document.getElementById("boss").innerText="💀 DEFEATED";
   return;
  }
 }

 document.getElementById("boss").innerText=
 "👹 "+boss.name+" P"+phase+" HP "+boss.hp;
}

/* ===== CHEST ===== */
function openBox(){

 let r=Math.random()*luck;

 let reward=0;

 if(r<0.4) reward=5;
 else if(r<0.7) reward=10;
 else reward=25;

 coins+=reward;

 float("+"+reward,200,200,"cyan");

 update();
 save();
}

/* ===== PERKS ===== */
function perk(t){

 if(t==="power") dmg++;
 if(t==="luck") luck+=0.2;

 save();
}

/* ===== LOCATION ===== */
function nextLoc(){
 let a=["village","volcano","space"];
 let i=a.indexOf(loc);
 loc=a[(i+1)%a.length];
 update();
 save();
}

/* ===== UI ===== */
function openShop(){shop.style.display="flex";}
function openChest(){chest.style.display="flex";}
function closeAll(){
 document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}

/* ===== LEVEL ===== */
function lvl(){
 return Math.floor(clicks/10)+1;
}

/* ===== UPDATE ===== */
function update(){
 coinsEl.innerText=coins;
 locEl.innerText=loc;
 lvlEl.innerText=lvl();
}

let coinsEl=document.getElementById("coins");
let locEl=document.getElementById("loc");
let lvlEl=document.getElementById("lvl");

load();
update();

</script>

</body>
  </html>
