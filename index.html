<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Шутер - Прототип | Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }
    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 9px;
      top: 0;
    }
    #crosshair::after {
      width: 20px;
      height: 2px;
      left: 0;
      top: 9px;
    }
    .health-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 200px;
      height: 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid white;
      border-radius: 5px;
      overflow: hidden;
    }
    .health-fill {
      width: 100%;
      height: 100%;
      background: #ff4444;
      transition: width 0.3s;
    }
    .instructions {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }
    .hitmarker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      pointer-events: none;
      display: none;
    }
    .hitmarker::before, .hitmarker::after {
      content: '';
      position: absolute;
      background: red;
    }
    .hitmarker::before {
      width: 2px;
      height: 30px;
      left: 14px;
      top: 0;
      transform: rotate(45deg);
    }
    .hitmarker::after {
      width: 30px;
      height: 2px;
      left: 0;
      top: 14px;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Очки: <span id="score">0</span></h2>
    <p>Врагов осталось: <span id="enemyCount">5</span></p>
  </div>
  <div id="crosshair"></div>
  <div class="hitmarker" id="hitmarker"></div>
  <div class="health-bar">
    <div class="health-fill" id="healthFill"></div>
  </div>
  <div class="instructions">
    <b>WASD</b> - движение<br>
    <b>Мышь</b> - обзор<br>
    <b>ЛКМ</b> - выстрел<br>
    <b>R</b> - перезарядка<br>
    <b>1-2</b> - смена оружия
  </div>

  <!-- Подключаем Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Голубое небо
    scene.fog = new THREE.Fog(0x87CEEB, 50, 150); // Туман для дальности

    // Камера (от первого лица)
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5); // Рост игрока ~1.6 метра

    // Основной рендерер
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Включаем тени
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // CSS2 рендерер для меток врагов
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // Чтобы не мешал кликам
    document.body.appendChild(labelRenderer.domElement);

    // --- УПРАВЛЕНИЕ ---
    const controls = new PointerLockControls(camera, document.body);
    
    // Блокировка курсора по клику
    renderer.domElement.addEventListener('click', () => {
      controls.lock();
    });

    controls.addEventListener('lock', () => {
      document.getElementById('ui').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';
      document.querySelector('.instructions').style.display = 'block';
    });

    controls.addEventListener('unlock', () => {
      document.getElementById('ui').style.display = 'none';
      document.getElementById('crosshair').style.display = 'none';
      document.querySelector('.instructions').style.display = 'none';
    });

    // Обработка движения
    const keyState = {
      w: false, a: false, s: false, d: false,
      shift: false, space: false
    };
    
    const moveSpeed = 8.0;
    const playerVelocity = new THREE.Vector3();
    const playerDirection = new THREE.Vector3();

    document.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': keyState.w = true; break;
        case 'KeyA': keyState.a = true; break;
        case 'KeyS': keyState.s = true; break;
        case 'KeyD': keyState.d = true; break;
        case 'ShiftLeft': keyState.shift = true; break;
        case 'Space': keyState.space = true; break;
        case 'KeyR': reload(); break;
        case 'Digit1': switchWeapon(0); break;
        case 'Digit2': switchWeapon(1); break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': keyState.w = false; break;
        case 'KeyA': keyState.a = false; break;
        case 'KeyS': keyState.s = false; break;
        case 'KeyD': keyState.d = false; break;
        case 'ShiftLeft': keyState.shift = false; break;
        case 'Space': keyState.space = false; break;
      }
    });

    // --- ОРУЖИЕ И СТРЕЛЬБА ---
    const weapons = [
      { name: 'Пистолет', damage: 25, fireRate: 300, ammo: 15, maxAmmo: 15, reloadTime: 1500 },
      { name: 'Автомат', damage: 35, fireRate: 100, ammo: 30, maxAmmo: 30, reloadTime: 2500 }
    ];
    let currentWeaponIndex = 0;
    let currentWeapon = weapons[currentWeaponIndex];
    let canShoot = true;
    let isReloading = false;
    let playerHealth = 100;
    let score = 0;
    
    // Звук выстрела (создаем через Web Audio API)
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    function playShootSound() {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function playHitSound() {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function switchWeapon(index) {
      if (isReloading || index === currentWeaponIndex) return;
      currentWeaponIndex = index;
      currentWeapon = weapons[currentWeaponIndex];
      document.getElementById('ui').innerHTML = `
        <h2>Очки: ${score}</h2>
        <p>Оружие: ${currentWeapon.name} | Патроны: ${currentWeapon.ammo}/${currentWeapon.maxAmmo}</p>
        <p>Врагов осталось: <span id="enemyCount">${enemies.length}</span></p>
      `;
    }

    function reload() {
      if (isReloading || currentWeapon.ammo === currentWeapon.maxAmmo) return;
      isReloading = true;
      setTimeout(() => {
        currentWeapon.ammo = currentWeapon.maxAmmo;
        isReloading = false;
        updateUI();
      }, currentWeapon.reloadTime);
    }

    function shoot() {
      if (!canShoot || isReloading || currentWeapon.ammo <= 0) return;
      
      canShoot = false;
      currentWeapon.ammo--;
      playShootSound();
      updateUI();
      
      // Создаем луч из центра экрана
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      
      const intersects = raycaster.intersectObjects(enemies);
      
      if (intersects.length > 0) {
        const enemy = intersects[0].object;
        enemy.userData.health -= currentWeapon.damage;
        playHitSound();
        
        // Показываем хитмаркер
        const hitmarker = document.getElementById('hitmarker');
        hitmarker.style.display = 'block';
        setTimeout(() => hitmarker.style.display = 'none', 150);
        
        if (enemy.userData.health <= 0) {
          // Уничтожаем врага
          scene.remove(enemy);
          const index = enemies.indexOf(enemy);
          if (index > -1) enemies.splice(index, 1);
          
          // Удаляем метку
          if (enemy.userData.label) {
            scene.remove(enemy.userData.label);
          }
          
          score += 100;
          updateUI();
          
          // Проверка победы
          if (enemies.length === 0) {
            setTimeout(() => {
              alert('Победа! Все враги уничтожены. Очки: ' + score);
              location.reload();
            }, 500);
          }
        }
      }
      
      setTimeout(() => {
        canShoot = true;
      }, currentWeapon.fireRate);
    }

    // Обработка клика мыши
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0 && controls.isLocked) { // Левая кнопка мыши
        shoot();
      }
    });

    function updateUI() {
      document.getElementById('ui').innerHTML = `
        <h2>Очки: ${score}</h2>
        <p>Оружие: ${currentWeapon.name} | Патроны: ${currentWeapon.ammo}/${currentWeapon.maxAmmo} ${isReloading ? '(перезарядка...)' : ''}</p>
        <p>Врагов осталось: <span id="enemyCount">${enemies.length}</span></p>
      `;
      document.getElementById('healthFill').style.width = playerHealth + '%';
    }

    // --- СОЗДАНИЕ УРОВНЯ ---
    
    // Освещение
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(50, 100, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -50;
    sunLight.shadow.camera.right = 50;
    sunLight.shadow.camera.top = 50;
    sunLight.shadow.camera.bottom = -50;
    scene.add(sunLight);

    // Пол
    const floorGeometry = new THREE.PlaneGeometry(100, 100);
    const floorMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x3a5f3a, 
      roughness: 0.8,
      side: THREE.DoubleSide
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Разметка пола (сетка)
    const gridHelper = new THREE.GridHelper(100, 40, 0x000000, 0x000000);
    gridHelper.material.opacity = 0.1;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // Стены и препятствия
    function createWall(x, y, z, w, h, d, color = 0x808080) {
      const geometry = new THREE.BoxGeometry(w, h, d);
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const wall = new THREE.Mesh(geometry, material);
      wall.position.set(x, y, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      return wall;
    }

    // Внешние стены
    createWall(0, 2.5, -25, 50, 5, 1, 0x8B7355);
    createWall(0, 2.5, 25, 50, 5, 1, 0x8B7355);
    createWall(-25, 2.5, 0, 1, 5, 50, 0x8B7355);
    createWall(25, 2.5, 0, 1, 5, 50, 0x8B7355);

    // Внутренние препятствия (ящики, стены)
    const obstacles = [
      { pos: [-10, 1, -10], size: [4, 2, 4], color: 0xCD853F },
      { pos: [10, 1, -10], size: [4, 2, 4], color: 0xCD853F },
      { pos: [-10, 1, 10], size: [4, 2, 4], color: 0xCD853F },
      { pos: [10, 1, 10], size: [4, 2, 4], color: 0xCD853F },
      { pos: [0, 1.5, 0], size: [6, 3, 2], color: 0xA0522D },
      { pos: [-15, 1.5, 0], size: [2, 3, 6], color: 0x696969 },
      { pos: [15, 1.5, 0], size: [2, 3, 6], color: 0x696969 },
      { pos: [0, 1, -15], size: [8, 2, 2], color: 0x808080 },
    ];

    obstacles.forEach(obs => {
      createWall(obs.pos[0], obs.pos[1], obs.pos[2], obs.size[0], obs.size[1], obs.size[2], obs.color);
    });

    // --- ВРАГИ ---
    const enemies = [];
    
    function createEnemy(x, z) {
      const geometry = new THREE.BoxGeometry(1, 2, 1);
      const material = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.4 });
      const enemy = new THREE.Mesh(geometry, material);
      enemy.position.set(x, 1, z);
      enemy.castShadow = true;
      enemy.receiveShadow = true;
      enemy.userData = {
        health: 100,
        speed: 1.5 + Math.random() * 2,
        detectionRange: 15,
        attackRange: 2,
        attackDamage: 10,
        lastAttackTime: 0
      };
      
      // Метка здоровья над врагом
      const healthDiv = document.createElement('div');
      healthDiv.textContent = '100%';
      healthDiv.style.color = 'white';
      healthDiv.style.fontWeight = 'bold';
      healthDiv.style.textShadow = '1px 1px 2px black';
      const label = new CSS2DObject(healthDiv);
      label.position.set(0, 2.5, 0);
      enemy.add(label);
      enemy.userData.label = label;
      
      scene.add(enemy);
      enemies.push(enemy);
      return enemy;
    }

    // Расставляем врагов
    createEnemy(-12, -12);
    createEnemy(12, -12);
    createEnemy(-12, 12);
    createEnemy(12, 12);
    createEnemy(0, -18);
    
    updateUI();

    // --- ИСКУССТВЕННЫЙ ИНТЕЛЛЕКТ ВРАГОВ ---
    function updateEnemies(deltaTime) {
      const playerPos = camera.position;
      
      enemies.forEach(enemy => {
        const enemyPos = enemy.position;
        const distanceToPlayer = enemyPos.distanceTo(playerPos);
        
        // Обновляем метку здоровья
        const healthPercent = Math.max(0, enemy.userData.health);
        enemy.userData.label.element.textContent = Math.ceil(healthPercent) + '%';
        
        if (distanceToPlayer < enemy.userData.detectionRange) {
          // Враг видит игрока и движется к нему
          const direction = new THREE.Vector3()
            .subVectors(playerPos, enemyPos)
            .normalize();
          
          // Смотрим на игрока
          enemy.lookAt(playerPos.x, enemyPos.y, playerPos.z);
          
          if (distanceToPlayer > enemy.userData.attackRange) {
            // Движение к игроку
            const moveAmount = enemy.userData.speed * deltaTime;
            enemy.position.x += direction.x * moveAmount;
            enemy.position.z += direction.z * moveAmount;
          } else {
            // Атака игрока
            const now = Date.now();
            if (now - enemy.userData.lastAttackTime > 1000) {
              enemy.userData.lastAttackTime = now;
              playerHealth -= enemy.userData.attackDamage;
              updateUI();
              
              // Эффект получения урона (красная вспышка)
              document.body.style.backgroundColor = 'rgba(255,0,0,0.3)';
              setTimeout(() => document.body.style.backgroundColor = '', 100);
              
              if (playerHealth <= 0) {
                alert('Вы погибли! Игра окончена.');
                location.reload();
              }
            }
          }
        }
      });
    }

    // --- ИГРОВОЙ ЦИКЛ ---
    let clock = new THREE.Clock();

    function animate() {
      const deltaTime = Math.min(clock.getDelta(), 0.1); // Ограничиваем дельту
      
      if (controls.isLocked) {
        // Обработка движения
        playerVelocity.set(0, 0, 0);
        playerDirection.set(0, 0, 0);
        
        const speed = keyState.shift ? moveSpeed * 1.5 : moveSpeed;
        
        if (keyState.w) playerDirection.z -= 1;
        if (keyState.s) playerDirection.z += 1;
        if (keyState.a) playerDirection.x -= 1;
        if (keyState.d) playerDirection.x += 1;
        
        if (playerDirection.length() > 0) {
          playerDirection.normalize();
          playerVelocity.x = playerDirection.x * speed * deltaTime;
          playerVelocity.z = playerDirection.z * speed * deltaTime;
          
          controls.moveRight(playerVelocity.x);
          controls.moveForward(-playerVelocity.z);
        }
        
        // Простая система "прыжка" (Space)
        if (keyState.space && camera.position.y <= 1.6) {
          // Можно добавить физику прыжка
        }
        
        // Обновление врагов
        updateEnemies(deltaTime);
      }
      
      // Рендеринг
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      
      requestAnimationFrame(animate);
    }

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Запуск игры
    animate();
    
    console.log('Игра готова! Кликните для захвата курсора.');
  </script>
</body>
    </html>
