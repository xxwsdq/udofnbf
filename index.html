<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тетрис на JavaScript</title>
    <style>
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        canvas {
            border: 2px solid #16213e;
            background-color: #0f0f1e;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .next-piece {
            text-align: center;
        }
        .score {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            min-width: 120px;
        }
        .score h3 {
            margin: 0 0 10px 0;
            color: #e94560;
        }
        .controls {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .controls p {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="tetris" width="300" height="600"></canvas>
        <div class="side-panel">
            <div class="next-piece">
                <h3>Следующая</h3>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            <div class="score">
                <h3>Счёт: <span id="scoreValue">0</span></h3>
                <p>Уровень: <span id="levelValue">1</span></p>
                <p>Линий: <span id="linesValue">0</span></p>
            </div>
            <div class="controls">
                <p>← → двигать</p>
                <p>↓ вниз</p>
                <p>↑ поворот</p>
                <p>Пробел – сброс</p>
            </div>
        </div>
    </div>

    <script>
        // ========== КОНСТАНТЫ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30; // пикселей
        const COLORS = [
            '#0f0f1e', // фон
            '#e94560', // I - красный
            '#f5c542', // O - жёлтый
            '#4e9af1', // T - синий
            '#6f42c1', // S - фиолетовый
            '#2ecc71', // Z - зелёный
            '#e67e22', // J - оранжевый
            '#1abc9c'  // L - бирюзовый
        ];

        // Фигуры (тетромино) – классические формы
        const TETROMINOS = [
            // I
            [[1,1,1,1]],
            // O
            [[1,1],
             [1,1]],
            // T
            [[0,1,0],
             [1,1,1]],
            // S
            [[0,1,1],
             [1,1,0]],
            // Z
            [[1,1,0],
             [0,1,1]],
            // J
            [[1,0,0],
             [1,1,1]],
            // L
            [[0,0,1],
             [1,1,1]]
        ];

        let board = [];                // матрица ROWS x COLS, 0 пусто, >0 цвет
        let currentPiece = null;      // { matrix, colorIndex, x, y }
        let nextPiece = null;
        let gameOver = false;
        let score = 0;
        let linesCleared = 0;
        let level = 1;
        let dropInterval = 500;       // мс
        let lastDropTime = 0;

        // DOM элементы
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextCtx = nextCanvas.getContext('2d');

        const scoreSpan = document.getElementById('scoreValue');
        const levelSpan = document.getElementById('levelValue');
        const linesSpan = document.getElementById('linesValue');

        // ========== ФУНКЦИИ ==========

        // Инициализация / сброс игры
        function init() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            gameOver = false;
            score = 0;
            linesCleared = 0;
            level = 1;
            dropInterval = 500;
            lastDropTime = 0;
            updateStats();

            // Создаём первую и следующую фигуры
            nextPiece = randomPiece();
            spawnPiece();
        }

        // Создать случайную фигуру
        function randomPiece() {
            const idx = Math.floor(Math.random() * TETROMINOS.length);
            const matrix = TETROMINOS[idx].map(row => [...row]);
            const colorIndex = idx + 1; // первый цвет зарезервирован для фона
            return { matrix, colorIndex };
        }

        // Поместить новую фигуру на поле
        function spawnPiece() {
            if (!nextPiece) {
                nextPiece = randomPiece();
            }
            currentPiece = {
                matrix: nextPiece.matrix.map(row => [...row]),
                colorIndex: nextPiece.colorIndex,
                x: Math.floor((COLS - nextPiece.matrix[0].length) / 2),
                y: 0
            };
            nextPiece = randomPiece();

            // Если новую фигуру сразу некуда поставить — игра окончена
            if (!isValidPosition(currentPiece.matrix, currentPiece.x, currentPiece.y)) {
                gameOver = true;
            }
        }

        // Проверка, может ли фигура находиться в заданной позиции
        function isValidPosition(matrix, posX, posY) {
            for (let row = 0; row < matrix.length; row++) {
                for (let col = 0; col < matrix[row].length; col++) {
                    if (matrix[row][col] !== 0) {
                        const boardX = posX + col;
                        const boardY = posY + row;
                        // Выход за границы или наложение на занятую клетку
                        if (boardX < 0 || boardX >= COLS ||
                            boardY >= ROWS ||
                            (boardY >= 0 && board[boardY][boardX] !== 0)) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // Зафиксировать текущую фигуру на доске
        function lockPiece() {
            const { matrix, x, y, colorIndex } = currentPiece;
            for (let row = 0; row < matrix.length; row++) {
                for (let col = 0; col < matrix[row].length; col++) {
                    if (matrix[row][col] !== 0) {
                        const boardY = y + row;
                        const boardX = x + col;
                        if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                            board[boardY][boardX] = colorIndex;
                        }
                    }
                }
            }
            // Удалить заполненные линии
            clearFullRows();
            // Создать новую фигуру
            spawnPiece();
        }

        // Удаление заполненных линий и начисление очков
        function clearFullRows() {
            let linesRemoved = 0;
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    // Удаляем строку
                    board.splice(row, 1);
                    board.unshift(new Array(COLS).fill(0));
                    row++; // проверить ту же позицию после смещения
                    linesRemoved++;
                }
            }

            if (linesRemoved > 0) {
                linesCleared += linesRemoved;
                // Начисление очков
                const pointsMap = [0, 100, 300, 500, 800];
                score += pointsMap[linesRemoved] * level;
                // Обновление уровня (каждые 1000 очков)
                const newLevel = Math.floor(score / 1000) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    dropInterval = Math.max(50, 500 - (level - 1) * 50);
                }
                updateStats();
            }
        }

        // Движение фигуры влево/вправо/вниз
        function movePiece(dx, dy) {
            if (!currentPiece || gameOver) return false;
            const newX = currentPiece.x + dx;
            const newY = currentPiece.y + dy;
            if (isValidPosition(currentPiece.matrix, newX, newY)) {
                currentPiece.x = newX;
                currentPiece.y = newY;
                return true;
            }
            // Если движение вниз невозможно — фиксируем фигуру
            if (dy === 1) {
                lockPiece();
            }
            return false;
        }

        // Поворот фигуры (по часовой стрелке)
        function rotatePiece() {
            if (!currentPiece || gameOver) return;
            const matrix = currentPiece.matrix;
            // Транспонирование + реверс строк = поворот на 90°
            const rotated = matrix[0].map((_, idx) => matrix.map(row => row[idx]).reverse());
            if (isValidPosition(rotated, currentPiece.x, currentPiece.y)) {
                currentPiece.matrix = rotated;
            }
            // Иначе — поворот не выполняется (нет места)
        }

        // Мгновенное падение (hard drop)
        function hardDrop() {
            if (!currentPiece || gameOver) return;
            while (isValidPosition(currentPiece.matrix, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
            }
            lockPiece();
        }

        // Обновить счёт/уровень/линии на экране
        function updateStats() {
            scoreSpan.textContent = score;
            levelSpan.textContent = level;
            linesSpan.textContent = linesCleared;
        }

        // ========== ОТРИСОВКА ==========
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const colorIndex = board[row][col];
                    ctx.fillStyle = COLORS[colorIndex];
                    ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                }
            }

            // Текущая фигура
            if (currentPiece && !gameOver) {
                const { matrix, x, y, colorIndex } = currentPiece;
                for (let row = 0; row < matrix.length; row++) {
                    for (let col = 0; col < matrix[row].length; col++) {
                        if (matrix[row][col] !== 0) {
                            ctx.fillStyle = COLORS[colorIndex];
                            const drawX = (x + col) * BLOCK_SIZE;
                            const drawY = (y + row) * BLOCK_SIZE;
                            ctx.fillRect(drawX, drawY, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                        }
                    }
                }
            }

            // Затемнение экрана при game over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
            }
        }

        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!nextPiece) return;

            const matrix = nextPiece.matrix;
            const colorIndex = nextPiece.colorIndex;
            const blockRenderSize = 25;
            // Центрируем на маленьком холсте
            const offsetX = (nextCanvas.width - matrix[0].length * blockRenderSize) / 2;
            const offsetY = (nextCanvas.height - matrix.length * blockRenderSize) / 2;

            for (let row = 0; row < matrix.length; row++) {
                for (let col = 0; col < matrix[row].length; col++) {
                    if (matrix[row][col] !== 0) {
                        nextCtx.fillStyle = COLORS[colorIndex];
                        nextCtx.fillRect(offsetX + col * blockRenderSize, 
                                        offsetY + row * blockRenderSize, 
                                        blockRenderSize - 1, 
                                        blockRenderSize - 1);
                    }
                }
            }
        }

        function render() {
            drawBoard();
            drawNextPiece();
        }

        // ========== ИГРОВОЙ ЦИКЛ ==========
        function gameLoop(timestamp) {
            if (!gameOver) {
                if (timestamp - lastDropTime > dropInterval) {
                    movePiece(0, 1); // движение вниз
                    lastDropTime = timestamp;
                }
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        // ========== УПРАВЛЕНИЕ С КЛАВИАТУРЫ ==========
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            e.preventDefault(); // чтобы страница не скроллилась

            switch (e.key) {
                case 'ArrowLeft':
                    movePiece(-1, 0);
                    break;
                case 'ArrowRight':
                    movePiece(1, 0);
                    break;
                case 'ArrowDown':
                    movePiece(0, 1);
                    // даём небольшой бонус за ускорение (1 очко за строку)
                    if (!gameOver) score += 1;
                    updateStats();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    hardDrop();
                    break;
                default:
                    break;
            }
            render();
        });

        // Запуск
        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
