<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Final Clicker Game</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

#btn{
  width:130px;
  height:130px;
  border-radius:50%;
  border:none;
  font-size:40px;
  margin-top:50px;
  background:linear-gradient(45deg,#ffb300,#ff6f00);
  cursor:pointer;
}

.shop{
  margin:5px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#boss{
  position:absolute;
  top:10px;
  right:10px;
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🎮 FINAL GAME</h2>

<div>💰 Монеты: <span id="coins">0</span></div>
<div>⭐ Уровень: <span id="level">1</span></div>

<div id="boss"></div>

<div>
<button class="shop" onclick="buySkin('watermelon',30)">🍉 30</button>
<button class="shop" onclick="buySkin('hero',40)">🦸 40</button>
</div>

<button id="btn" onclick="clicker()">🎮</button>

<div>
<button onclick="openChest('rare')">🧰 Rare</button>
<button onclick="openChest('epic')">🧰 Epic</button>
</div>

<script>

let coins = 0;
let clicks = 0;
let skin = "default";

let keys = {
 rare:0,
 epic:0
};

let owned = {
 watermelon:false,
 hero:false
};

let boss = null;

/* SAVE */
function save(){
 localStorage.setItem("coins",coins);
 localStorage.setItem("clicks",clicks);
 localStorage.setItem("keys",JSON.stringify(keys));
 localStorage.setItem("owned",JSON.stringify(owned));
}

/* LOAD */
function load(){
 coins = Number(localStorage.getItem("coins") || 0);
 clicks = Number(localStorage.getItem("clicks") || 0);

 keys = JSON.parse(localStorage.getItem("keys") || "null") || keys;
 owned = JSON.parse(localStorage.getItem("owned") || "null") || owned;

 update();
}

/* CLICK */
function clicker(){

 coins++;
 clicks++;

 // drop keys
 if(Math.random()<0.2) keys.rare++;
 if(Math.random()<0.1) keys.epic++;

 // boss spawn
 if(clicks % 12 === 0){
  spawnBoss();
 }

 // boss damage
 if(boss){
  boss.hp--;

  document.getElementById("boss").innerText =
  "👹 "+boss.name+" HP: "+boss.hp;

  if(boss.hp <= 0){
   coins += 50;
   boss = null;
   document.getElementById("boss").innerText = "💀 defeated!";
  }
 }

 update();
 save();
}

/* BOSS */
function spawnBoss(){
 boss = {
  name:"Goblin",
  hp:10
 };

 document.getElementById("boss").innerText =
 "👹 "+boss.name+" HP: "+boss.hp;
}

/* CHEST */
function openChest(type){

 if(keys[type] <= 0){
  return;
 }

 keys[type]--;

 let reward = "";

 let r = Math.random();

 if(type === "rare"){
  if(r < 0.5) reward = "+5💰";
  else reward = "nothing";
 }

 if(type === "epic"){
  if(r < 0.5) reward = "+10💰";
  else reward = "key";
 }

 if(reward.includes("5")) coins += 5;
 if(reward.includes("10")) coins += 10;

 update();
 save();
}

/* SKIN */
function buySkin(name,price){

 if(!owned[name]){
  if(coins < price) return;
  coins -= price;
  owned[name] = true;
 }

 skin = name;

 if(name === "watermelon")
  btn.innerText = "🍉";

 if(name === "hero")
  btn.innerText = "🦸";

 save();
 update();
}

/* LEVEL */
function level(){
 return Math.floor(clicks / 10) + 1;
}

/* UPDATE */
function update(){

 document.getElementById("coins").innerText = coins;
 document.getElementById("level").innerText = level();

}

load();
update();

</script>

</body>
</html>
