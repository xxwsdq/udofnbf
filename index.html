<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Loot RPG v6 NOT BORING</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0c0f1a;
color:white;
}

.panel{
margin:10px;
padding:10px;
background:rgba(255,255,255,0.06);
border-radius:12px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.bar{
width:100%;
height:12px;
background:#333;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:red;
transition:0.2s;
}
</style>
</head>

<body>

<div class="panel">
<h2>🎮 LOOT RPG v6</h2>
<input id="nick" placeholder="ник">
<button onclick="start()">Играть</button>
</div>

<div id="game" style="display:none;">

<div class="panel">
👤 <span id="name"></span><br>
💰 <span id="coins"></span> |
⭐ Lv <span id="level"></span>
</div>

<div class="panel">
⚔️ Сила: <span id="str"></span> |
🛡 Защита: <span id="def"></span> |
🍀 Удача: <span id="luck"></span>
</div>

<div class="panel">
<button onclick="safeFarm()">🟢 безопасный фарм</button>
<button onclick="riskFarm()">🔴 риск фарм (x3)</button>
<button onclick="openChest()">🧰 сундук</button>
<button onclick="boss()">👹 босс</button>
</div>

<div class="panel">
<h3>👹 БОСС</h3>
<div class="bar"><div class="fill" id="bossFill"></div></div>
<button onclick="attackBoss()">⚔️ удар</button>
</div>

</div>

<script>

/* PLAYER */
let player="";
let coins=0;
let level=1;

let str=1;
let def=1;
let luck=1;

/* BOSS */
let bossHP=100;
let bossMax=100;

/* START */
function start(){

player=document.getElementById("nick").value||"Player";

document.getElementById("game").style.display="block";

update();
}

/* SAFE FARM */
function safeFarm(){

let gain=5;

coins+=gain;
gainStats();

update();
}

/* RISK FARM */
function riskFarm(){

let chance=Math.random();

if(chance < 0.6){
coins+=15*luck;
}else{
coins-=10;
}

gainStats();
update();
}

/* CHEST */
function openChest(){

let r=Math.random();

if(r<0.5){
coins+=10;
}else if(r<0.8){
coins+=30;
str++;
}else if(r<0.95){
coins+=80;
luck++;
}else{
coins=0; // 💀 пустой/провал
}

update();
}

/* BOSS */
function attackBoss(){

let dmg=str*2;

bossHP-=dmg;

if(bossHP<=0){
coins+=100;
level++;
bossMax+=50;
bossHP=bossMax;
}

update();
}

/* STATS */
function gainStats(){

if(coins>50){
level++;
coins=0;

str++;
def++;
luck++;
}
}

/* UI */
function update(){

nameSpan.innerText=player;
coinsSpan.innerText=coins;
levelSpan.innerText=level;

strSpan.innerText=str;
defSpan.innerText=def;
luckSpan.innerText=luck;

bossFill.style.width=(bossHP/bossMax*100)+"%";
}

</script>

</body>
</html>
